<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>数当てゲーム</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        .card { background: white; max-width: 400px; margin: 0 auto; padding: 20px;border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, button { padding: 10px; font-size: 16px; margin: 5px; }
        /* 【変更】 初期状態は display: none; で表示にする */
        .reset-btn { background-color: #6c757d; color: white; border: none; border-radius: 4px; cursor: pointer; display: none; }
        .reset-btn:hover { background-color: #5a6268; }
        /* 履歴表示エリアのスタイル */
        #history { text-align: left; margin-top: 20px; padding-left: 20px; max-height: 200px; overflow-y: auto; }
        #history li { margin-bottom: 5px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>1~100の数当てゲーム</h2>
        <p>数字を入力して「送信」を押してね！</p>
        <input type="number" id="guess" min="1" max="100">
        <button onclick="checkAnswer()">送信</button>
        <!-- id="reset-btn" を追加してJavaScriptから操作しやすくする  -->
        <button id="reset-btn" onclick="resetGame()" class="reset-btn">もう一度遊ぶ</button>

        <p id="message"></p>
        <p id="count"></p>

        <!-- 履歴を表示するリストを追加 -->
         <ul id="history"></ul>
    </div>

<script>
    let target = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;

function checkAnswer() {
    let guessInput = document.getElementById('guess');
    let guess = parseInt(guessInput.value);
    let msg =document.getElementById('message');
    let countMsg = document.getElementById('count');
    let historyList = document.getElementById('history');

    if (isNaN(guess)) {
        msg.textContent = "数字を入力してください。";
        return;
    }

    attempts++;

    let resultText = "";

    if (guess === target)
    {
        msg.textContent = `正解！🎉 ${target} でした！`;
        countMsg.textContent = `${attempts} 回目で当たりました！`;

        // 【追加】 正解した時だけ「もう一度遊ぶ」ボタンを表示する
        document.getElementById('reset-btn').style.display = "inline-block";
    } else if (guess < target) {
        msg.textContent = "もっと【大きい】数字です。";
    } else {
        msg.textContent = "もっと【小さい】数字です。";
    }

    // 履歴を行 (li要素) として追加する処理
    let newLog = document.createElement('li');
    // 「１回目: 50」のように入力した数字(guess) を記録する
    newLog.textContent = `${attempts}回目: ${guess}`;
    historyList.prepend(newLog); // 最新の入力履歴を一番上に追加
    
    //入力欄を自動でクリアしてフォーカスを合わせる
    guessInput.value = "";
    guessInput.focus();
}

// ゲームを初期化(リセット) する関数
function resetGame() {
    target = Math.floor(Math.random() * 100) + 1; // 新しい正解をセット
    attempts = 0; // 回数をリセット

    // 表示されているテキストや履歴を消去
    document.getElementById('message').textContent = "";
    document.getElementById('count').textContent = "";
    document.getElementById('history').innerHTML = ""; // 履歴のリストを空にする

    // 【追加】　リセットボタンを再び非表示にする
    document.getElementById('reset-btn').style.display = "none";

    // 入力欄をクリアしてフォーカス
    let guessInput = document.getElementById('guess');
    guessInput.value = "";
    guessInput.focus();
}
</script>

</body>

</html>
